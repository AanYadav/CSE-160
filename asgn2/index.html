<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>ASG2: 3D Sloth</title>
    <style>
        body {
            background: #1a1e1a;
            color: #c8d5b9;
            font-family: 'Courier New', monospace;
            display: flex;
            gap: 18px;
            padding: 16px;
            margin: 0;
        }
        canvas {
            border: 2px solid #4a6741;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .panel {
            background: #252b22;
            border: 1px solid #3a4a35;
            border-radius: 8px;
            padding: 14px 18px;
            min-width: 260px;
            font-size: 13px;
        }
        h3 { margin: 0 0 10px; color: #8fbc5a; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
        label { display: block; margin: 6px 0 2px; color: #a0b890; }
        input[type=range] { width: 100%; accent-color: #6a9c40; margin-bottom: 2px; }
        .btn-row { display: flex; gap: 8px; margin: 8px 0; }
        button {
            flex: 1; padding: 6px 0; border: 1px solid #4a6741; background: #2e3a28;
            color: #c8d5b9; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
        }
        button:hover { background: #3d4e35; }
        button.active { background: #4a6741; color: #fff; }
        #numIndicator {
            background: #1a2018; border: 1px solid #3a4a35; border-radius: 4px;
            padding: 6px 10px; font-size: 12px; color: #8fbc5a; margin-bottom: 10px;
        }
        .hint { font-size: 11px; color: #607050; margin-top: 10px; line-height: 1.5; }
        hr { border-color: #3a4a35; margin: 10px 0; }
    </style>
</head>
<body onload="main()">
    <canvas id="webgl" width="600" height="600"></canvas>

    <div class="panel">
        <div id="numIndicator">FPS: -- | MS: --</div>

        <h3>Global Rotation</h3>
        <label>Rotate X: <input type="range" min="-180" max="180" value="0" id="globalRotX"></label>
        <label>Rotate Y: <input type="range" min="-180" max="180" value="0" id="globalRotY"></label>

        <hr>
        <h3>Animation</h3>
        <div class="btn-row">
            <button id="animOn">▶ Idle</button>
            <button id="animOff">■ Freeze</button>
        </div>
        <div class="btn-row">
            <button id="climbBtn">▲ Climb Up</button>
            <button id="climbDownBtn">▼ Climb Down</button>
        </div>

        <hr>
        <h3>Front Left Arm</h3>
        <label>Shoulder: <input type="range" min="-60" max="60" value="0" id="jFL1"></label>
        <label>Elbow: <input type="range" min="-80" max="20" value="0" id="jFL2"></label>
        <label>Claw: <input type="range" min="-60" max="60" value="0" id="jFL3"></label>

        <h3>Front Right Arm</h3>
        <label>Shoulder: <input type="range" min="-60" max="60" value="0" id="jFR1"></label>
        <label>Elbow: <input type="range" min="-80" max="20" value="0" id="jFR2"></label>
        <label>Claw: <input type="range" min="-60" max="60" value="0" id="jFR3"></label>

        <h3>Back Left Leg</h3>
        <label>Hip: <input type="range" min="-60" max="60" value="0" id="jBL1"></label>
        <label>Knee: <input type="range" min="-80" max="20" value="0" id="jBL2"></label>
        <label>Claw: <input type="range" min="-60" max="60" value="0" id="jBL3"></label>

        <h3>Back Right Leg</h3>
        <label>Hip: <input type="range" min="-60" max="60" value="0" id="jBR1"></label>
        <label>Knee: <input type="range" min="-80" max="20" value="0" id="jBR2"></label>
        <label>Claw: <input type="range" min="-60" max="60" value="0" id="jBR3"></label>

        <div class="hint">🖱 Drag to rotate &nbsp;|&nbsp; Shift+Click to poke!<br>
        ▲▼ Climb buttons to move up/down branch</div>
    </div>

    <script src="lib/webgl-utils.js"></script>
    <script src="lib/webgl-debug.js"></script>
    <script src="lib/cuon-utils.js"></script>
    <script src="lib/cuon-matrix-cse160.js"></script>
    <script src="asg2.js"></script>
</body>
</html>
