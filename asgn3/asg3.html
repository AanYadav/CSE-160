<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Island of Swallow Falls 🍉🐊</title>
  <meta name="description" content="Explore the wild food-animal jungle from Cloudy with a Chance of Meatballs 2!">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:#0a0d0a;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100vh;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;color:#e8f5e9;
    }
    h1{font-size:1.6rem;letter-spacing:.05em;margin-bottom:12px;color:#a5d6a7;
       text-shadow:0 0 15px rgba(165,214,167,0.4);}
    #wrap{position:relative;
      border:4px solid #2e7d32;border-radius:8px;
      box-shadow:0 0 40px rgba(0,0,0,0.6);}
    canvas{display:block;border-radius:4px;cursor:crosshair;}
    #hud{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
         background:rgba(27, 94, 32, 0.8);backdrop-filter:blur(8px);
         border:1px solid rgba(255,255,255,0.1);border-radius:25px;
         padding:8px 24px;font-size:0.95rem;color:#f1f8e9;white-space:nowrap;
         box-shadow:0 4px 15px rgba(0,0,0,0.3); pointer-events:none;}
    #ctrl{margin-top:15px;font-size:.8rem;color:#81c784;text-align:center;line-height:2.0;}
    #ctrl span{background:#1b5e20;border:1px solid #388e3c;border-radius:4px;
               padding:2px 8px;margin:0 3px;color:#e8f5e9;font-weight:bold;}
    button{
      background:#2e7d32;color:#fff;border:none;border-radius:20px;
      padding:10px 20px;font-weight:bold;cursor:pointer;margin-top:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.5);transition:background 0.2s;
    }
    button:hover{background:#388e3c;}
    #wow-info{display:none;}
  </style>

  <!-- Libraries -->
  <script src="lib/cuon-matrix-cse160.js"></script>
  <script src="lib/cuon-utils.js"></script>
  <script src="lib/webgl-debug.js"></script>
  <script src="lib/webgl-utils.js"></script>

  <!-- Camera -->
  <script src="camera.js"></script>

  <!-- Geometry -->
  <script src="geometry/geometry.js"></script>
  <script src="geometry/triangle.js"></script>
  <script src="geometry/cube.js"></script>
  <script src="geometry/square.js"></script>

  <!-- Main app -->
  <script src="asg3.js"></script>
</head>
<body onload="main()">
  <h1>🌴 Island of Swallow Falls 🍖🍓</h1>
  <div id="wrap">
    <canvas id="webgl" width="800" height="600">
      Please use a browser that supports "canvas"
    </canvas>
    <div id="hud">Welcome to the Foodimal Jungle! 🍉🍓🐊</div>
    <canvas id="hudMap" width="128" height="128" style="position:absolute;top:10px;right:10px;border:2px solid #fff;background:rgba(0,0,0,0.4);border-radius:4px;"></canvas>
  </div>
  <div id="ctrl">
    <span>W</span><span>S</span> Move forward/back &nbsp;·&nbsp;
    <span>A</span><span>D</span> Strafe &nbsp;·&nbsp;
    <span>Q</span><span>E</span> Rotate View &nbsp;·&nbsp;
    Mouse drag = Look Around &nbsp;·&nbsp;
    <span>F</span> = Add/Remove Block
    <div style="margin-top:10px;">
      Ride: 
      <button onclick="setRide('elephant')">🐘 Elephant</button>
      <button onclick="setRide('hippo')">🦛 Hippo</button>
      <button onclick="setRide('spider')">🕷️ Spider</button>
      <button onclick="setRide('marshmallow')">🍡 Marsh</button>
      <button onclick="setRide(null)" style="background:#666;">❌ OFF</button>
    </div>
  </div>
</body>
</html>
