<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assignment 0 - Vector Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h2 { margin-bottom: 10px; color: #a0c4ff; }
    canvas { display: block; border: 2px solid #444; }
    .controls {
      margin-top: 12px;
      background: #16213e;
      padding: 12px 20px;
      border-radius: 8px;
      width: 400px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      flex-wrap: wrap;
    }
    label { min-width: 30px; color: #a0c4ff; font-weight: bold; }
    input[type="number"] {
      width: 70px; padding: 4px;
      background: #0f3460; border: 1px solid #444;
      color: #fff; border-radius: 4px;
    }
    input[type="button"] {
      padding: 5px 14px; background: #533483;
      color: white; border: none;
      border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    input[type="button"]:hover { background: #6a43a8; }
    select {
      padding: 4px; background: #0f3460;
      border: 1px solid #444; color: #fff; border-radius: 4px;
    }
    .divider { border-top: 1px solid #333; margin: 10px 0; }
    span.coord { color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <h2>Assignment 0 – Vector Library</h2>

  <canvas id="example" width="400" height="400">
    Please use a browser that supports "canvas"
  </canvas>

  <div class="controls">
    <div class="row">
      <label>v1:</label>
      <span class="coord">x</span>
      <input type="number" id="v1x" value="2.25" step="0.1">
      <span class="coord">y</span>
      <input type="number" id="v1y" value="2.25" step="0.1">
    </div>
    <div class="row">
      <label>v2:</label>
      <span class="coord">x</span>
      <input type="number" id="v2x" value="5" step="0.1">
      <span class="coord">y</span>
      <input type="number" id="v2y" value="0" step="0.1">
    </div>
    <div class="row">
      <input type="button" value="Draw" onclick="handleDrawEvent()">
    </div>
    <div class="divider"></div>
    <div class="row">
      <label style="min-width:70px">Operation:</label>
      <select id="operation">
        <option value="add">Add</option>
        <option value="sub">Sub</option>
        <option value="mul">Mul</option>
        <option value="div">Div</option>
        <option value="magnitude">Magnitude</option>
        <option value="normalize">Normalize</option>
        <option value="angle">Angle Between</option>
        <option value="area">Area</option>
      </select>
      <span class="coord">Scalar:</span>
      <input type="number" id="scalar" value="2" step="0.1" style="width:60px">
    </div>
    <div class="row">
      <input type="button" value="Draw Operation" onclick="handleDrawOperationEvent()">
    </div>
  </div>

  <script src="../lib/cuon-matrix-cse160.js"></script>
  <script src="asgn0.js"></script>
</body>
</html>
